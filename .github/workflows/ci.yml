name: OLLM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Type check
        run: npm run check

      - name: Build runtime
        run: npm run build

      - name: Runtime + backend + authentication smoke
        run: npm run test:smoke

      - name: Production preflight contract
        env:
          NODE_ENV: production
          OLLM_VERSION: 0.2.0
          OLLM_MODEL_ID: onegodian-llm
          OLLM_API_KEY: ci-ollm-production-key-000000000001
          OLLM_BACKEND_URL: https://backend.example.invalid
          OLLM_BACKEND_MODEL: production-model-placeholder
        run: npm run preflight:production
